[package]
name = "nautilus-alpaca"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca Markets integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]
backtest-node = [
  "dep:nautilus-backtest",
  "dep:nautilus-persistence",
  "nautilus-persistence/catalog-query",
]
warehouse-clickhouse = ["nautilus-live/warehouse-clickhouse"]
live = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:dotenvy",
  "dep:log",
  "dep:nautilus-common",
  "dep:nautilus-infrastructure",
  "dep:nautilus-live",
  "nautilus-live/node",
  "dep:nautilus-network",
  "dep:nautilus-trading",
  "dep:rust_decimal",
  "dep:rmp-serde",
  "dep:toml",
  "dep:tokio-tungstenite",
  "dep:uuid",
  "tokio",
]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"], optional = true }
nautilus-backtest = { workspace = true, features = ["streaming"], optional = true }
nautilus-core = { workspace = true }
nautilus-infrastructure = { workspace = true, features = [
  "postgres",
], optional = true }
nautilus-live = { workspace = true, optional = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, optional = true }
nautilus-persistence = { workspace = true, optional = true }
nautilus-trading = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dotenvy = { workspace = true, optional = true }
log = { workspace = true, optional = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
url = { workspace = true }
ustr = { workspace = true }
uuid = { workspace = true, optional = true }

[[bin]]
name = "alpaca-option-chain-scan-node"
path = "bin/option_chain_scan_node.rs"
required-features = ["live", "backtest-node"]
doc = false
test = false

[[bin]]
name = "alpaca-options-node"
path = "bin/options_node.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-compare-option-chain-scan"
path = "bin/compare_option_chain_scan.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "earnings-sync"
path = "bin/earnings_sync.rs"
required-features = ["live"]
doc = false
test = false
