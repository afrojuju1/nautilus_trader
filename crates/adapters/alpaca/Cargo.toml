[package]
name = "nautilus-alpaca"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca Markets integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "python",
  "pyo3/extension-module",
]
high-precision = ["nautilus-model/high-precision"]
live = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:log",
  "dep:nautilus-common",
  "dep:nautilus-live",
  "dep:nautilus-network",
  "dep:rust_decimal",
  "dep:tokio-tungstenite",
  "tokio",
]
python = [
  "live",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-network/python",
  "pyo3",
  "pyo3-stub-gen",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"], optional = true }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true, optional = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
log = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true }

[[bin]]
name = "alpaca-load-option-contracts"
path = "bin/load_option_contracts.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-load-option-snapshots"
path = "bin/load_option_snapshots.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-dry-run-put-credit"
path = "bin/dry_run_put_credit.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-check-account-orders"
path = "bin/check_account_orders.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-validate-mleg-order"
path = "bin/validate_mleg_order.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-submit-mleg-order"
path = "bin/submit_mleg_order.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-paper-execution-harness"
path = "bin/paper_execution_harness.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-submit-order-list-harness"
path = "bin/submit_order_list_harness.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-submit-order-list-bridge"
path = "bin/submit_order_list_bridge.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-watch-trade-updates"
path = "bin/watch_trade_updates.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-put-credit-strategy-loop"
path = "bin/put_credit_strategy_loop.rs"
required-features = ["live"]
doc = false
test = false
