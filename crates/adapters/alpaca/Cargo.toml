[package]
name = "nautilus-alpaca"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca Markets integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "python",
  "pyo3/extension-module",
]
high-precision = ["nautilus-model/high-precision"]
backtest-node = ["dep:nautilus-backtest", "dep:nautilus-persistence"]
warehouse-clickhouse = ["nautilus-live/warehouse-clickhouse"]
live = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:dotenvy",
  "dep:log",
  "dep:nautilus-common",
  "dep:nautilus-infrastructure",
  "dep:nautilus-live",
  "nautilus-live/node",
  "dep:nautilus-network",
  "dep:nautilus-trading",
  "dep:sqlx",
  "dep:rust_decimal",
  "dep:toml",
  "dep:tokio-tungstenite",
  "dep:uuid",
  "tokio",
]
python = [
  "live",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-network/python",
  "pyo3",
  "pyo3-stub-gen",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"], optional = true }
nautilus-backtest = { workspace = true, features = ["streaming"], optional = true }
nautilus-core = { workspace = true }
nautilus-infrastructure = { workspace = true, features = [
  "postgres",
], optional = true }
nautilus-live = { workspace = true, optional = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, optional = true }
nautilus-persistence = { workspace = true, optional = true }
nautilus-trading = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dotenvy = { workspace = true, optional = true }
log = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
url = { workspace = true }
ustr = { workspace = true }
uuid = { workspace = true, optional = true }

[[bin]]
name = "alpaca-load-option-contracts"
path = "bin/load_option_contracts.rs"
required-features = ["live"]
doc = false
test = false

