[package]
name = "nautilus-alpaca"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca Markets integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = ["python"]
high-precision = []
live = ["tokio"]
python = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, optional = true }
url = { workspace = true }

[[bin]]
name = "alpaca-load-option-contracts"
path = "bin/load_option_contracts.rs"
required-features = ["live"]
doc = false
test = false

[[bin]]
name = "alpaca-load-option-snapshots"
path = "bin/load_option_snapshots.rs"
required-features = ["live"]
doc = false
test = false
