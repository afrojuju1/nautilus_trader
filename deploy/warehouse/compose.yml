name: nautilus-warehouse

x-clickhouse-image: &clickhouse-image ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.3}
x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-warehouse}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}

services:
  clickhouse:
    container_name: nautilus-warehouse-clickhouse
    image: *clickhouse-image
    environment:
      <<: *clickhouse-env
    ports:
      - "${CLICKHOUSE_HTTP_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER:-default}\" --password \"$${CLICKHOUSE_PASSWORD:-}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-4g}
    cpus: ${CLICKHOUSE_CPUS:-2}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - warehouse

  clickhouse-smoke:
    image: *clickhouse-image
    profiles: ["smoke"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      <<: *clickhouse-env
    entrypoint: ["sh", "-c"]
    command:
      - >-
        clickhouse-client --host clickhouse --user "$${CLICKHOUSE_USER:-default}"
        --password "$${CLICKHOUSE_PASSWORD:-}"
        --query "SELECT 'warehouse_ok' AS status, version() AS version"
    networks:
      - warehouse

networks:
  warehouse:

volumes:
  clickhouse-data:
  clickhouse-logs:
